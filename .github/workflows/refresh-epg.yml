# Regenera o EPG toda semana: a grade é relativa à data de hoje (ontem → +30 dias) e, estática,
# envelheceria — o testador da Store veria "sem programação".
name: Refresh EPG

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: atualiza EPG demo"
          git push
